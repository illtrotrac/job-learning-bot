name: Daily Job Learning Digest

on:
  schedule:
    # Runs every day at 7:00 AM UTC.
    # Convert to your local time: https://dateful.com/convert/utc
    # Examples:  '0 7 * * *' = 7am UTC  |  '0 22 * * *' = 7am SGT  |  '0 0 * * *' = 7am JST
    - cron: '0 7 * * *'
  workflow_dispatch:  # lets you trigger a run manually from the GitHub Actions tab

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit the database back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Scrape new job listings ─────────────────────────────────────
      - name: Scrape jobs
        working-directory: src
        env:
          SERPAPI_KEY:         ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PATH: data/job_learning.db
        run: python scraper.py

      # ── Step 2: Analyze skill gaps ───────────────────────────────────────────
      - name: Analyze skill gaps
        working-directory: src
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PATH: data/job_learning.db
        run: python analyzer.py

      # ── Step 3: Fetch learning resources ─────────────────────────────────────
      - name: Fetch learning resources
        working-directory: src
        env:
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PATH: data/job_learning.db
        run: python resources.py

      # ── Step 4: Send Telegram digest ─────────────────────────────────────────
      - name: Send digest
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PATH: data/job_learning.db
        run: python digest.py --send

      # ── Persist the updated database in the repo ─────────────────────────────
      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/job_learning.db
          # Only commit if the database actually changed
          git diff --staged --quiet || git commit -m "chore: update job learning database [skip ci]"
          git push
